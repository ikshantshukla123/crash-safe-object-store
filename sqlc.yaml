version: "2"
sql:
  - engine: postgresql
    # sqlc reads the migrations as the schema, so the Go types can never drift
    # from the real database — there is no second schema file to keep in sync.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/db/dbgen
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
