# Local development stack. Production reuses this file unchanged and layers
# deploy/docker-compose.prod.yml on top, keeping local and production in parity.
#
# Image tags are pinned, never `latest`, so a rebuild cannot silently change
# the database version underneath the data volume.

name: objstore

services:
  postgres:
    # pgvector image rather than plain postgres: it bundles the vector
    # extension needed in Phase 10, and ships pg_trgm like any Postgres.
    image: pgvector/pgvector:pg16
    container_name: objstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-objstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-objstore}
    ports:
      # Published for local psql and host-run tests only. The prod overlay
      # removes this: forbids exposing Postgres on the host.
      #
      # Host port is configurable and defaults to 5433 so it cannot collide
      # with a Postgres already installed natively on the developer's machine.
      # The container port stays 5432, so service-to-service URLs are
      # unaffected.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-objstore} -d ${POSTGRES_DB:-objstore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: objstore-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    # One-shot: runs to completion, then exits. The api service waits for it
    # to succeed, so the schema is never behind the code.
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-objstore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-objstore}?sslmode=disable"
      - "up"

  node1: &node
    container_name: objstore-node1
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_NAME: node
    environment:
      NODE_NAME: node1
      NODE_ADDR: ":9000"
      NODE_DATA_DIR: /data/chunks
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - node1data:/data/chunks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  node2:
    <<: *node
    container_name: objstore-node2
    environment:
      NODE_NAME: node2
      NODE_ADDR: ":9000"
      NODE_DATA_DIR: /data/chunks
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - node2data:/data/chunks

  node3:
    <<: *node
    container_name: objstore-node3
    environment:
      NODE_NAME: node3
      NODE_ADDR: ":9000"
      NODE_DATA_DIR: /data/chunks
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - node3data:/data/chunks

  api:
    container_name: objstore-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_NAME: api
    environment:
      API_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_TOKEN: ${DEMO_TOKEN:-}
      # Service names resolve on the Compose network; no host ports involved.
      DATABASE_URL: postgres://${POSTGRES_USER:-objstore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-objstore}?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-15m}
      PRESIGN_KEY_ID: ${PRESIGN_KEY_ID:-k1}
      PRESIGN_SECRET: ${PRESIGN_SECRET:?set PRESIGN_SECRET in .env}
      PRESIGN_MAX_EXPIRY: ${PRESIGN_MAX_EXPIRY:-168h}
      STORAGE_NODES: node1=http://node1:9000,node2=http://node2:9000,node3=http://node3:9000
      REPLICAS_N: ${REPLICAS_N:-3}
      WRITE_QUORUM_W: ${WRITE_QUORUM_W:-2}
      MAX_PART_SIZE_BYTES: ${MAX_PART_SIZE_BYTES:-16777216}
      MULTIPART_EXPIRY: ${MULTIPART_EXPIRY:-24h}
      WAL_DIR: /data/wal
      WAL_SEGMENT_BYTES: ${WAL_SEGMENT_BYTES:-67108864}
      META_CACHE_TTL: ${META_CACHE_TTL:-60s}
      SMALL_OBJECT_CACHE_LIMIT_BYTES: ${SMALL_OBJECT_CACHE_LIMIT_BYTES:-1048576}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GC_INTERVAL: ${GC_INTERVAL:-1h}
      GC_BATCH: ${GC_BATCH:-100}
      GC_ORPHAN_GRACE: ${GC_ORPHAN_GRACE:-24h}
    volumes:
      - waldata:/data/wal
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    container_name: objstore-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD_NAME: worker
    environment:
      WORKER_ADDR: ":8092"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-objstore}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-objstore}?sslmode=disable
      REDIS_ADDR: redis:6379
      STORAGE_NODES: node1=http://node1:9000,node2=http://node2:9000,node3=http://node3:9000
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-2s}
      HEALTH_DOWN_THRESHOLD: ${HEALTH_DOWN_THRESHOLD:-3}
      HEALTH_UP_THRESHOLD: ${HEALTH_UP_THRESHOLD:-2}
      REPLICATOR_BATCH: ${REPLICATOR_BATCH:-50}
      REPLICATOR_CONCURRENCY: ${REPLICATOR_CONCURRENCY:-4}
      REPAIR_BATCH: ${REPAIR_BATCH:-20}
      REPAIR_INTERVAL: ${REPAIR_INTERVAL:-15s}
      SCRUB_BATCH: ${SCRUB_BATCH:-50}
      SCRUB_INTERVAL: ${SCRUB_INTERVAL:-30s}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  chaos:
    container_name: objstore-chaos
    restart: unless-stopped
    # The Docker socket is root-equivalent; this container is demo-only.
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile.chaos
    environment:
      CHAOS_ADDR: ":8090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_TOKEN: ${DEMO_TOKEN:-}
      DOCKER_HOST: unix:///var/run/docker.sock
      API_BASE_URL: http://api:8080
      API_CONTAINER: objstore-api
      NODE_CONTAINER_PREFIX: objstore-node
      K6_BASE_URL: http://api:8080
      K6_SCRIPT: /etc/chaos/loadtest.js
    volumes:
      # Root-equivalent. Demo only, internal network only, token required.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/k6:/etc/chaos:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health?token=${DEMO_TOKEN:-}"]
      interval: 10s
      timeout: 3s
      retries: 3

  edge:
    container_name: objstore-edge
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "${EDGE_PORT:-8000}:8000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  redisdata:
  node1data:
  node2data:
  node3data:
  waldata:
