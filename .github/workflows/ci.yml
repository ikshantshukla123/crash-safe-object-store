name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      # A real Postgres, not a mock — CLAUDE.md §15 requires it for anything
      # touching constraints or transactions. pgvector image also ships pg_trgm.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: objstore
          POSTGRES_PASSWORD: objstore
          POSTGRES_DB: objstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U objstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://objstore:objstore@localhost:5432/objstore_test?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet and test
        run: make test

      - name: Build all binaries
        run: make build

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
